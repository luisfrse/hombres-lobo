<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0d1a2a">
  <title data-i18n-doc="ac.doc">Homes llop · Codis d'invitació</title>
  <link rel="stylesheet" href="/dc/fuentes/fuentes.css">
  <link rel="stylesheet" href="/dc/tokens.css">
  <link rel="stylesheet" href="/dc/base.css">
  <link rel="stylesheet" href="/lobo.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/tema.js"></script>
</head>
<body class="dc-body admin">
  <header class="dc-header">
    <a class="dc-brand" href="/admin"><span class="dc-brand__tile"><span class="dc-icon" data-icon="moon" aria-hidden="true"></span></span><span><span data-i18n="app.nombre">Homes llop</span> <small class="dc-muted-h" data-i18n="ac.titulo"></small></span></a>
    <div class="dc-header__actions"><div class="cab-idioma" data-lang-slot></div><div id="tema-slot"></div><div id="salir-slot"></div></div>
  </header>
  <main class="lb-main lb-admin">
    <span class="dc-chip dc-chip--info" id="estado-servidor" role="status"></span>
    <div class="filtros tarjeta">
      <label class="campo"><span data-i18n="ac.persona"></span><input id="in-etiqueta" class="dc-input" type="text" maxlength="60" data-i18n-ph="ac.persona_ph" autocomplete="off"></label>
      <label class="campo"><span data-i18n="ac.caduca_opc"></span><input type="date" id="in-caduca" class="dc-input"></label>
      <button class="btn" id="btn-crear" type="button" data-i18n="ac.crear"></button>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
    <div id="nuevo"></div>
    <div id="tabla" class="tabla-scroll"></div>
  </main>
  <script src="/dc/iconos/iconos.js"></script>
  <script src="/i18n.js"></script>
  <script src="/js/iconos-lobo.js"></script>
  <script src="/js/comun.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
