<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n-doc="ac.doc">Homes llop · Codis d'invitació</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/lobo.css">
</head>
<body class="admin">
  <header class="cab">
    <h1 class="logo">🐺 <span data-i18n="app.nombre">Homes llop</span> · <small data-i18n="ac.titulo"></small></h1>
    <div class="cab-idioma" data-lang-slot></div>
  </header>
  <main>
    <span class="estado-servidor" id="estado-servidor"></span>
    <div class="filtros tarjeta">
      <label class="campo"><span data-i18n="ac.persona"></span><input id="in-etiqueta" type="text" maxlength="60" data-i18n-ph="ac.persona_ph" autocomplete="off"></label>
      <label class="campo"><span data-i18n="ac.caduca_opc"></span><input type="date" id="in-caduca"></label>
      <button class="btn" id="btn-crear" type="button" data-i18n="ac.crear"></button>
    </div>
    <p class="error" id="error" hidden></p>
    <div id="nuevo"></div>
    <div id="tabla" class="tabla-scroll"></div>
  </main>
  <script src="/i18n.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
